# fly.toml app configuration file generated for draper-society-lookbook on 2026-08-03T00:14:55+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'draper-society-lookbook'
primary_region = 'iad'

[build]
[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'draper_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
