name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_STYLIST_WHATSAPP_NUMBER="${{ secrets.STYLIST_WHATSAPP_NUMBER }}" \
            --build-arg NEXT_PUBLIC_STYLIST_DISPLAY_NAME="${{ secrets.STYLIST_DISPLAY_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
